worker_processes auto;

# nginx runs as a non-root user (nginxinc/nginx-unprivileged), which can
# write only under /tmp, so its pid file and temp files go there
pid /tmp/nginx.pid;

events { worker_connections 1024; }

http {

    proxy_temp_path /tmp/proxy_temp;
    client_body_temp_path /tmp/client_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    include /etc/nginx/mime.types;

    sendfile on;

    # Leave nginx's version out of the Server header and error pages
    server_tokens off;

    server {
        # A non-root user can't bind below 1024
        listen 8080;

        server_name localhost;

        # Security headers, on every response (always: 404s too). Locations
        # inherit these only while none sets an add_header of its own. No
        # HSTS: Cloudflare terminates TLS
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # Report-only: browsers log violations in the console and block
        # nothing. Every service URL is on this origin ('self'); Vuetify sets
        # inline styles; webfontloader loads Roboto from Google; Cloudflare
        # injects its analytics beacon. Enforcing is a separate change, once
        # the live site shows no violations
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

        root /usr/share/nginx/html/apps/vigilant-harvest;

        index index.html;

        location /apps/vigilant-harvest {
            try_files $uri $uri/ /index.html;
        }

        location /apps/vigilant-harvest/ {
            try_files $uri $uri/ /index.html;
        }

        location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            root /usr/share/nginx/html;
            expires max;
            log_not_found off;
            access_log off;
        }

        error_page 404 /index.html;

        location = /index.html {
            expires -1;
        }
    }
}