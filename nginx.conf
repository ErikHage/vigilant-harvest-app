worker_processes auto;

# nginx runs as a non-root user (nginxinc/nginx-unprivileged), which can
# write only under /tmp, so its pid file and temp files go there
pid /tmp/nginx.pid;

events { worker_connections 1024; }

http {

    proxy_temp_path /tmp/proxy_temp;
    client_body_temp_path /tmp/client_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    include /etc/nginx/mime.types;

    sendfile on;

    # Leave nginx's version out of the Server header and error pages
    server_tokens off;

    server {
        # A non-root user can't bind below 1024
        listen 8080;

        server_name localhost;

        root /usr/share/nginx/html/apps/vigilant-harvest;

        index index.html;

        location /apps/vigilant-harvest {
            try_files $uri $uri/ /index.html;
        }

        location /apps/vigilant-harvest/ {
            try_files $uri $uri/ /index.html;
        }

        location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            root /usr/share/nginx/html;
            expires max;
            log_not_found off;
            access_log off;
        }

        error_page 404 /index.html;

        location = /index.html {
            expires -1;
        }
    }
}