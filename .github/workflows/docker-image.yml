name: Docker image

# Runs lint and the unit tests on every push and pull request, then, if they
# pass, builds the image, and pushes it to Docker Hub from master only, as
# ehage/vigilant-harvest-app:latest and :sha-<commit>.
#
# Repository secrets:
#   DOCKERHUB_TOKEN  Docker Hub access token for ehage, Read & Write.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ehage/vigilant-harvest-app

jobs:
  # Lint and the unit suite, on the Node the image builds with (node:lts). The
  # UI suite needs the local services, so it isn't run here
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run test:unit

  # Only once lint and the unit tests have passed
  image:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: github.ref == 'refs/heads/master'
        with:
          username: ehage
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/master' }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
